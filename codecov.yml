comment: false

coverage:
  status:
    project:
      default:
        # don't fail the patch/project check on small coverage fluctuations
        threshold: 1%
    patch:
      default:
        informational: true

# Phylotypes.jl is not part of the loaded module (it depends on a `Phylo`
# package that is not a dependency) and would otherwise be reported as 0%.
ignore:
  - "src/Phylotypes.jl"
